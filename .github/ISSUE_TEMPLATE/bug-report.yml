name: Bug report
description: Report a reproducible checker, hook, install, or documentation problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a reproducible problem. Remove private or client data before submitting.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Codex plugin installation
        - Lifecycle hooks
        - Local checker
        - Rule result
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example and the command or prompt used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include exact rule IDs or error text when available.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v2.2.0
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private client text, and personal data.
          required: true
