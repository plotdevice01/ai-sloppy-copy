<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">AI Sloppy Copy workflow</title>
  <desc id="desc">Verified evidence and approved voice feed a draft, then the local checker returns rule IDs for repair before human approval.</desc>
  <rect width="1200" height="280" rx="32" fill="#f8fafc"/>
  <text x="56" y="58" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">HOW IT WORKS</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="56" y="104" width="184" height="104" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="148" y="148" fill="#0f172a" font-size="17" font-weight="800">EVIDENCE</text>
    <text x="148" y="177" fill="#64748b" font-size="14">verified sources</text>

    <path d="M254 156h40" stroke="#94a3b8" stroke-width="3"/>
    <path d="m288 148 10 8-10 8" fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>

    <rect x="310" y="104" width="184" height="104" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="402" y="148" fill="#0f172a" font-size="17" font-weight="800">DRAFT</text>
    <text x="402" y="177" fill="#64748b" font-size="14">approved voice</text>

    <path d="M508 156h40" stroke="#94a3b8" stroke-width="3"/>
    <path d="m542 148 10 8-10 8" fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>

    <rect x="564" y="90" width="216" height="132" rx="22" fill="#0f172a"/>
    <text x="672" y="143" fill="#f8fafc" font-size="17" font-weight="800">LOCAL CHECKER</text>
    <text x="672" y="174" fill="#5eead4" font-size="14">rules + protected text</text>

    <path d="M794 156h40" stroke="#94a3b8" stroke-width="3"/>
    <path d="m828 148 10 8-10 8" fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>

    <rect x="850" y="104" width="134" height="104" rx="18" fill="#fff" stroke="#f97368" stroke-width="2"/>
    <text x="917" y="148" fill="#0f172a" font-size="17" font-weight="800">REPAIR</text>
    <text x="917" y="177" fill="#64748b" font-size="14">exact rule IDs</text>

    <path d="M998 156h40" stroke="#94a3b8" stroke-width="3"/>
    <path d="m1032 148 10 8-10 8" fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>

    <rect x="1054" y="104" width="90" height="104" rx="18" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
    <path d="m1080 151 13 13 28-33" fill="none" stroke="#0f766e" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
    <text x="1099" y="190" fill="#0f766e" font-size="13" font-weight="800">APPROVE</text>
  </g>
</svg>
